# .github/workflows/jekyll.yml
name: Build Jekyll site

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          cache-version: 0

      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Check built site
        run: bundle exec htmlproofer ./_site --disable-external

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Install Chromium and its system libraries
        working-directory: _scripts
        run: uv run --locked --group browser playwright install --with-deps --only-shell chromium

      - name: Test built site in Chromium
        working-directory: _scripts
        run: uv run --locked --group browser pytest
