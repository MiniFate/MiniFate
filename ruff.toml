# Only _code/*.py is linted here. Ruff 0.16 also formats Python fences
# inside Markdown; chapter content is prose, so keep ruff out of it.
target-version = "py312"
line-length = 100
extend-exclude = ["*.md"]

[lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "RET",    # flake8-return
    "RUF",    # Ruff-specific
    "PTH",    # flake8-use-pathlib
]
ignore = [
    "E501",   # line too long (handled by formatter)
]
